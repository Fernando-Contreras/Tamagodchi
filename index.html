<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ccbed">
<title>The Dog God · Tamagodchi</title>
<link rel="icon" type="image/png" href="assets/spot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1b2f; --cream:#fff6dc; --cream2:#f3e0a8; --pink:#ff7fa0; --gold:#f2b83b;
  --hunger:#ff9a3c; --happy:#ff6f96; --energy:#6bd16b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka','Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(70px 26px at 10% 14%, #fffbef 62%, #0000 64%),
    radial-gradient(110px 34px at 86% 9%, #fffbef 62%, #0000 64%),
    radial-gradient(90px 30px at 78% 72%, #fffbefcc 62%, #0000 64%),
    radial-gradient(120px 36px at 6% 82%, #fffbefcc 62%, #0000 64%),
    linear-gradient(#7ccbed, #cdeef8) fixed;
  display:flex;justify-content:center;
}
.wrap{
  --w:min(100%,410px,max(300px,calc((100vh - 40px) * .58)));   /* ancho del aparato: cabe completo en pantallas bajas */
  width:100%;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;
}
.langbar{width:var(--w);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lang{display:flex;background:#fffdf5;border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.lang button{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:transparent;border:0;padding:4px 12px;cursor:pointer}
.lang button+button{border-left:3px solid var(--ink)}
.lang button.on{background:var(--gold)}

/* ---------- el aparato ---------- */
.device{
  width:var(--w);
  padding:18px 18px 24px;
  background:linear-gradient(165deg,#fffaf0 0%,#f8e8b8 100%);
  border:5px solid var(--ink);
  border-radius:44% 44% 38% 38% / 20% 20% 24% 24%;
  box-shadow:0 8px 0 var(--ink), 0 18px 30px #1b1b2f40, inset 0 -12px 0 #0000001a;
}
.logo{display:block;width:62%;margin:2px auto 10px}
.bezel{
  background:#2b2f4d;border:4px solid var(--ink);border-radius:22px;padding:10px;
  box-shadow:inset 0 0 0 3px #4b517e;
}
.screen{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#8fd3ee;user-select:none;-webkit-user-select:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}

.toast{
  position:absolute;left:50%;top:8px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  background:#fffdf5;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:600;font-size:14px;
  text-align:center;max-width:92%;transition:opacity .2s,transform .2s;z-index:5;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.pane{
  position:absolute;inset:auto 10px 10px 10px;z-index:4;background:#fffdf5f2;border:3px solid var(--ink);
  border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 0 #1b1b2f55;
}
.pane[hidden]{display:none}
.pane h3{margin:0 0 4px;font-size:17px}
.pane p{margin:4px 0 10px;font-size:14px}
.row{display:flex;gap:8px;justify-content:center}
.row>button,.ghost{
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;flex:1;
  box-shadow:0 3px 0 var(--ink);
}
.row>button:active,.ghost:active{transform:translateY(3px);box-shadow:none}
.row>button:disabled{opacity:.5}
.row small{display:block;font-weight:400;font-size:12px;opacity:.7}
.ghost{flex:none;margin-top:8px;padding:5px 14px;font-size:13px;box-shadow:none;border-width:2px;opacity:.8}
.gscore{font-size:13px!important;opacity:.7}

.say{min-height:26px;margin:12px 4px 6px;text-align:center;font-weight:600;font-size:16px}
.bars{display:flex;gap:8px;margin:0 2px 12px}
.bar{flex:1;display:flex;align-items:center;gap:4px;font-size:18px}
.track{flex:1;height:12px;background:#fff;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden}
.track i{display:block;height:100%;width:50%;border-radius:5px;transition:width .4s}
.bar[data-k=hunger] i{background:var(--hunger)}
.bar[data-k=happy] i{background:var(--happy)}
.bar[data-k=energy] i{background:var(--energy)}
.bar.low .track{animation:pulse .9s infinite}
.bar.low i{background:#e5383b!important}
@keyframes pulse{50%{background:#ffc9c9}}

.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;padding:0 4px}
.btn{
  font:inherit;cursor:pointer;color:var(--ink);background:#fff;border:3.5px solid var(--ink);border-radius:20px;
  padding:8px 4px 6px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;
  font-weight:600;font-size:13px;
}
.btn span{font-size:25px;line-height:1.1}
.btn i{font-style:normal}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn:disabled,.btn.dim{opacity:.45}

/* ---------- controles visuales del minijuego ---------- */
.gameui{position:absolute;inset:0;z-index:4;pointer-events:none}
.gameui[hidden]{display:none}
.gameui>*{pointer-events:auto}
.gchip{
  position:absolute;left:8px;top:8px;background:#fffdf5e6;border:3px solid var(--ink);
  border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;white-space:nowrap;
}
/* Kush: tres columnas invisibles para dar el zarpazo + botón para cambiar entre ver y oír */
.gzones{position:absolute;left:0;right:0;top:40px;bottom:50px;display:flex}
.gzones button{flex:1;background:transparent;border:0;cursor:pointer;padding:0}
.gzones button:active{background:#ffffff22}
.gmode{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:inherit;font-weight:700;font-size:16px;
  cursor:pointer;color:var(--ink);background:#fffdf5f2;border:3px solid var(--ink);border-radius:999px;padding:5px 18px;
  box-shadow:0 4px 0 var(--ink);white-space:nowrap;
}
.gmode:active{transform:translateX(-50%) translateY(4px);box-shadow:none}
.gameui.sg .gzones,.gameui.sg .gmode{display:none}
.gameui.kg .gzones,.gameui.kg .gmode{display:flex}
.gameui.kg .gmode{display:block}
/* menú de comida: 6 opciones en cuadrícula */
.row.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row.foods>button{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px;line-height:1.15;font-size:13px;box-shadow:0 2px 0 var(--ink);border-width:2.5px}
.row.foods i{font-style:normal;font-size:22px;line-height:1.1}
.row.foods small{font-size:10.5px;margin-top:0}
.gquit{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;font:inherit;font-size:14px;line-height:1;
  cursor:pointer;background:#fffdf5e6;border:2.5px solid var(--ink);padding:0;
}
/* la barra de energía "carga" mientras Spot duerme */
.bar.charging .track{position:relative}
.bar.charging i{
  background:repeating-linear-gradient(45deg,#6bd16b 0 8px,#9be89b 8px 16px)!important;background-size:22px 22px;
  animation:charge .8s linear infinite;
}
@keyframes charge{to{background-position:22px 0}}
.btn.alert{animation:wiggle .7s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.foot{margin-top:14px;text-align:center;font-weight:600;font-size:13px;opacity:.7}

/* ---------- modal Dogerhood ---------- */
.modal{position:fixed;inset:0;z-index:20;background:#1b1b2f99;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{
  width:min(100%,520px);max-height:92vh;overflow:auto;background:var(--cream);border:5px solid var(--ink);
  border-radius:26px 26px 0 0;padding:16px 16px 26px;
}
@media(min-width:560px){.modal{align-items:center}.sheet{border-radius:26px}}
.sheet header{display:flex;gap:14px;align-items:center}
.sheet header img{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);object-fit:cover;background:#bfe8f6}
.sheet h2{margin:0;font-size:22px}
.sheet .sub{font-size:14px;opacity:.75}
.x{margin-left:auto;align-self:flex-start;font:inherit;font-size:20px;line-height:1;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px}
.devo{margin:14px 0 4px;font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.devo-track{height:16px;background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.devo-track i{display:block;height:100%;background:linear-gradient(90deg,#ffd84a,#ff9ec0)}
.note{font-size:13px;opacity:.75;margin:8px 0 14px}
.sheet h3{margin:16px 0 8px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:13px}
.card b{display:block;font-size:15px}
.card em{font-style:normal;opacity:.7;display:block}
.card.locked{background:#e6e1cf;opacity:.8}
.card.locked b{letter-spacing:2px}
.opts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.opts button{font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:7px 12px}
.opts button.danger{margin-left:auto;color:#b3261e}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <div class="lang" role="group" aria-label="Character / Personaje">
      <button data-char="spot">Spot</button><button data-char="kush">Kush</button>
    </div>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button data-lang="en">EN</button><button data-lang="es">MX</button>
    </div>
  </div>
  <div class="device">
    <img class="logo" src="assets/logo.png" alt="The Dog God">
    <div class="bezel">
      <div class="screen" id="screen">
        <canvas id="cv" width="64" height="64" data-i18n-aria="aria.canvas"></canvas>
        <div class="gameui" id="gameUi" hidden>
          <button class="gquit" id="gQuit" data-i18n-aria="game.exit">✕</button>
          <div class="gchip" id="gChip"></div>
          <div class="gzones" id="gZones"><button data-z="0"></button><button data-z="1"></button><button data-z="2"></button></div>
          <button class="gmode" id="gMode"></button>
        </div>
        <div class="toast" id="toast" role="status"></div>
        <div class="pane" id="pane" hidden></div>
      </div>
    </div>

    <div class="say" id="say" aria-live="polite"></div>
    <div class="bars" id="bars">
      <div class="bar" data-k="hunger" data-i18n-title="bar.hunger"><span>🍗</span><div class="track"><i></i></div></div>
      <div class="bar" data-k="happy"  data-i18n-title="bar.happy"><span>💛</span><div class="track"><i></i></div></div>
      <div class="bar" data-k="energy" data-i18n-title="bar.energy"><span>⚡</span><div class="track"><i></i></div></div>
    </div>

    <div class="btns">
      <button class="btn" id="bFeed"><span>🍗</span><i data-i18n="feed"></i></button>
      <button class="btn" id="bPlay"><span>🎾</span><i data-i18n="play"></i></button>
      <button class="btn" id="bLight"><span>💡</span><i data-i18n="light"></i></button>
      <button class="btn" id="bClean"><span>🧼</span><i data-i18n="clean"></i></button>
      <button class="btn" id="bMed"><span>💊</span><i data-i18n="med"></i></button>
      <button class="btn" id="bInfo"><span>🐾</span><i data-i18n="info"></i></button>
    </div>
  </div>
  <div class="foot" data-i18n="foot"></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Dogerhood">
    <header>
      <img src="assets/spot.png" alt="Spot">
      <div>
        <h2 id="mName">Spot</h2>
        <div class="sub" id="mSub"></div>
      </div>
      <button class="x" id="mClose" data-i18n-aria="close">✕</button>
    </header>
    <div class="devo"><span id="dLabel"></span><span id="dNum"></span></div>
    <div class="devo-track"><i id="dFill"></i></div>
    <div class="note" data-i18n="note"></div>
    <h3 data-i18n="dogerhoodH"></h3>
    <div class="grid" id="mGrid"></div>
    <div class="opts">
      <button id="mSound"></button>
      <button id="mReset" class="danger" data-i18n="reset"></button>
    </div>
  </div>
</div>

const LANG_KEY = 'tdg-lang';
let LANG = (() => { try { const v = localStorage.getItem(LANG_KEY); if (v === 'es' || v === 'en') return v; } catch(e){} return 'en'; })();
function tr(k, vars){
  let s = I18N[LANG][k] ?? I18N.en[k] ?? k;
  if (typeof s === 'string' && vars) for (const n in vars) s = s.split('{'+n+'}').join(vars[n]);
  return s;
}

/* =====================================================================
   ESTADO
   ===================================================================== */
const DEFAULT = {
  hatched:false, hatchTaps:0,
  hunger:70, happy:70, energy:80,
  poops:0, poopAcc:0, sick:false, sickAcc:0, sleeping:false, over:0,      // over = lo que se pasó de lleno (Spot come sin límite… con consecuencias)
  devotion:0, unlocked:[], ageMin:0,
  lastPetDevo:0, mute:false, last:Date.now(),
  char:'spot',                 // personaje en pantalla: 'spot' | 'kush'
};
// los cuidados de Kush; nap = se durmió sola de cansancio; wokenUntil = hasta cuándo está despierta aunque sea de día
function newKush(){ return { hunger:70, happy:70, energy:80, poops:0, poopAcc:0, sick:false, sickAcc:0, over:0, nap:false, wokenUntil:0 }; }
let S = load();

function load(){
  let s = null;
  try { const raw = localStorage.getItem(KEY); if (raw) s = Object.assign({}, DEFAULT, JSON.parse(raw)); } catch(e){}
  if (!s) s = Object.assign({}, DEFAULT, { unlocked:[], last:Date.now() });
  s.k = Object.assign(newKush(), s.k || {});
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const clamp = (v,a=0,b=100) => Math.max(a, Math.min(b, v));
const $ = s => document.querySelector(s);
const now = () => Date.now();

/* =====================================================================
   LÓGICA
   ===================================================================== */
const stageOf = () => !S.hatched ? 'egg' : S.devotion < STAGE_AT.spot ? 'cachorro' : S.devotion < STAGE_AT.dios ? 'spot' : 'dios';
const stageName = st => tr('stage.'+st);

/* ---------- Spot y Kush se cuidan igual: todo opera sobre "la mascota en pantalla" ---------- */
const isKush = () => S.char === 'kush';
const pet = () => isKush() ? S.k : S;
const petName = () => isKush() ? 'Kush' : 'Spot';
const asleepNow = () => isKush() ? kushAsleep() : S.sleeping;
// como tr(), pero con {name} y, si existe, la variante con género de Kush (p. ej. "k.t.asleep")
const trp = (k, v) => {
  const kk = 'k.' + k;
  const key = isKush() && (I18N[LANG][kk] || I18N.en[kk]) ? kk : k;
  return tr(key, Object.assign({ name: petName() }, v));
};
const gain = n => { if (!isKush()) addDevotion(n); };          // la devoción es solo de Spot

function advancePet(p, name, min, away, sl){
  const f = away ? OFFLINE_FACTOR : 1;
  const hLoss = RATE.hunger * (sl ? .5 : 1);
  const pLoss = RATE.happy * (sl ? .3 : 1) * (p.sick ? 2 : 1) + 0.03 * p.poops;

  const fl = v => away ? Math.min(v, OFFLINE_FLOOR) : 0;   // piso mientras no estabas
  p.hunger = Math.max(fl(p.hunger), p.hunger - hLoss*min*f);
  p.happy  = Math.max(fl(p.happy),  p.happy  - pLoss*min*f);
  p.over = Math.max(0, (p.over || 0) - 1.5*min*f);          // el empacho se le va pasando

  if (sl) p.energy = clamp(p.energy + RATE.energySleep*min*f);
  else    p.energy = Math.max(away ? Math.min(p.energy, 15) : 0, p.energy + RATE.energyAwake*min*f);

  if (!sl) {
    p.poopAcc += min * (away ? .3 : 1);
    while (p.poopAcc >= POOP_EVERY_MIN) {
      p.poopAcc -= POOP_EVERY_MIN;
      if (p.poops < (away ? 2 : 3)) p.poops++;
    }
  }

  if (!away && !p.sick) {                  // se enferma por descuido: popós sin limpiar y/o hambre extrema
    p.sickAcc += min * ((p.poops >= 2 ? 1 : 0) + (p.hunger < 8 ? 1 : 0));
    if (p.sickAcc >= SICK_AFTER_MIN) { p.sick = true; p.sickAcc = 0; toast(tr('t.sick', { name })); sfx('no'); }
  }
}
function advance(min, away){
  if (min <= 0) return;
  if (S.hatched) {
    advancePet(S, 'Spot', min, away, S.sleeping);
    if (S.sleeping && S.energy >= 99) { S.sleeping = false; S.energy = 100; toast(tr('t.woke')); }
    else if (!S.sleeping && S.energy <= 3 && !away) { S.sleeping = true; toast(tr('t.tired')); }
    S.ageMin += min;
  }
  advancePet(S.k, 'Kush', min, away, kushAsleep());      // Kush duerme de día (según el reloj)
  // Kush se duerme SOLA cuando le queda poca energía, y no despierta hasta que su barra se llena (sin avisarle a nadie)
  const k = S.k;
  if (!k.nap && !kushAsleep() && k.energy <= KUSH_TIRED && !away) { k.nap = true; k.wokenUntil = 0; }
  else if (k.nap && k.energy >= 99) k.nap = false;
}

let lastMood = null, lastMoodChar = null;
function tick(){
  const t = now();
  let raw = (t - S.last) / 60000;
  S.last = t;
  if (raw <= 0) return;
  const away = raw > 3;
  raw = Math.min(raw, 24*60);
  if (away && (S.hatched || isKush()) && raw > 10) toast(tr('t.back', { name: petName() }));
  advance(raw * SPEED, away);
  const m = mood();
  if (lastMoodChar !== S.char) { lastMoodChar = S.char; lastMood = m; return; }     // al cambiar de personaje no avisamos
  if (m !== lastMood) {
    if (m === 'hungry' && lastMood !== null) toast(tr('t.hungry', { name: petName() }));
    if (m === 'sad' && lastMood !== null) toast(tr('t.wantsPlay', { name: petName() }));
    lastMood = m;
  }
}

function moodOf(p, sl, hatched){
  if (!hatched) return 'egg';
  if (sl) return 'sleep';
  if (p.sick) return 'sick';
  if (p.hunger < 25) return 'hungry';
  if (p.happy < 25) return 'sad';
  if (p.energy < 20) return 'sleepy';
  if (p.happy > 75 && p.hunger > 50) return 'happy';
  return 'ok';
}
const mood = () => isKush() ? moodOf(S.k, kushAsleep(), true) : moodOf(S, S.sleeping, S.hatched);

function addDevotion(n){
  const before = stageOf();
  S.devotion += n;
  for (const d of DOGERHOOD) {
    if (S.devotion >= d.at && !S.unlocked.includes(d.id)) {
      S.unlocked.push(d.id); toast(tr('t.joined', { name: tr('dog.'+d.id+'.name') })); sfx('fanfare');
    }
  }
  const after = stageOf();
  if (after !== before) { startAnim('evolve', 2600); toast(tr('t.evolved', { stage: stageName(after) })); sfx('fanfare'); }
}

/* ---------- acciones ---------- */
const guard = () => {
  if (!isKush() && !S.hatched) { toast(tr('t.tapEgg')); return false; }
  return true;
};

/* 6 comidas, cada una con SU animación (ver drawFood). h = hambre, hp = alegría, poop = qué tan pronto sigue el popó */

  { id:'kibble',   icon:'🥣', h:25, hp:2,  poop:25, ms:2500, for:['spot','kush'] },

  { id:'shrimp',   icon:'🦐', h:20, hp:20, poop:15, ms:2900, for:['kush'] },
  { id:'milk',     icon:'🥛', h:15, hp:25, poop:20, ms:3300, for:['kush'] },
];
const foodsNow = () => FOODS.filter(f => f.for.includes(S.char));
const OVER_SICK = 50;                   // cuánto se puede pasar de lleno antes de enfermarse
function openFeed(){
  if (!guard()) return;
  const p = pet();
  if (asleepNow()) return toast(trp('t.asleep'));
  // Kush NO come si no quiere; Spot, en cambio, come lo que le des (y ya veremos las consecuencias)
  if (isKush() && p.hunger >= 92) { startAnim('no', 900); sfx('no'); return toast(trp('t.notHungry')); }
  showPane(`<h3>${tr('feed.title')}</h3>
    <div class="row foods">${foodsNow().map(f =>
      `<button data-feed="${f.id}"><i>${f.icon}</i><b>${tr('food.'+f.id)}</b><small>${tr('food.'+f.id+'.sub')}</small></button>`).join('')}
    </div><button class="ghost" data-close>${tr('cancel')}</button>`);
}
function feed(id){
  hidePane();
  const F = FOODS.find(f => f.id === id), p = pet();
  if (!F || !F.for.includes(S.char)) return;
  const before = p.hunger, name = petName();
  const total = p.hunger + F.h, excess = Math.max(0, total - 100);           // lo que no le cabía
  p.hunger = clamp(total); p.happy = clamp(p.happy + F.hp); p.poopAcc += F.poop;
  if (F.energy) p.energy = clamp(p.energy + F.energy);        // el helado da un empujón de azúcar
  startAnim('eat', F.ms, { food:id });
  sfx('eat');
  if (excess > 0 && !isKush()) {                              // Spot comió de más: más popó (casi de inmediato) y, si se pasa mucho, se enferma
    p.over = (p.over || 0) + excess;
    const extra = Math.max(1, Math.round(excess / 15));
    setTimeout(() => { p.poops = Math.min(3, p.poops + extra); sfx('no'); toast(tr('t.poopNow', { name })); hudAt = 0; save(); }, F.ms - 400);
    if (p.over >= OVER_SICK && !p.sick) setTimeout(() => { p.sick = true; p.sickAcc = 0; sfx('no'); toast(tr('t.overSick', { name })); hudAt = 0; save(); }, F.ms + 300);
    else if (p.over >= 25) setTimeout(() => toast(tr('t.stuffed', { name })), F.ms + 300);
  }
  if (before < 80) gain(3);
  save();
}

/* ---------- minijuegos ----------
   Spot ATRAPA la pelota (los perros no la lanzan): te la tiran desde un lado y tú tocas la pantalla en el
   momento justo para que salte. Kush CAZA ratones: "oye todo, ve todo, pero no al mismo tiempo" —
   solo percibe lo que coincide con su modo actual (👀 ver / 👂 oír). */
let game = null;
const CATCH_T = [1300, 1200, 1100, 1000, 900];     // ms que tarda la pelota en llegar a la boca de Spot
const JUMP_MS = 340, JUMP_LEAD = 170;              // el salto dura 340 ms y la boca llega arriba a los 170
const HS_X = [12, 32, 52];                         // columnas donde aparece el ratón de Kush
function openPlay(){
  if (!guard()) return;
  const p = pet();
  if (asleepNow()) return toast(trp('t.asleep'));
  if (p.sick) return toast(trp('t.cantPlaySick'));
  if (p.energy < 20) return toast(trp('t.tooTired'));
  hidePane();
  if (isKush()) startKushGame(); else startSpotGame();
}
function renderGame(){
  const ui = $('#gameUi');
  if (!game) { ui.hidden = true; return; }
  ui.hidden = false; ui.classList.toggle('kg', game.kind === 'kush'); ui.classList.toggle('sg', game.kind === 'spot');
  $('#gChip').textContent = tr(game.kind === 'kush' ? 'kgame.chip' : 'game.chip', { r: Math.min(Math.max(game.round, 1), 5), n: game.wins });
  if (game.kind === 'kush') $('#gMode').textContent = tr(game.mode === 'see' ? 'kgame.see' : 'kgame.hear');
}
function finishGame(){
  const g = game, w = g.wins, K = g.kind === 'kush', p = pet();
  hidePane();
  startAnim(K ? 'kushwin' : 'play', 2600);
  p.energy = clamp(p.energy - (K ? 10 : 15)); p.hunger = clamp(p.hunger - 8);
  if (w >= 3) { p.happy = clamp(p.happy + 30); gain(5); toast(tr('t.won', { w, name: petName() })); sfx('fanfare'); }
  else        { p.happy = clamp(p.happy + 10); gain(1); toast(tr('t.lost', { w })); }
  save();
}

/* -- Spot: atrapar la pelota -- */
function startSpotGame(){
  const g = game = { kind:'spot', round:0, wins:0, phase:'idle', say:tr('game.prompt') };
  hudAt = 0; renderGame(); setTimeout(() => nextThrow(g), 900);
}
function nextThrow(g){
  if (game !== g) return;
  if (g.round >= 5) return finishGame();
  g.round++; g.side = Math.random() < .5 ? 'L' : 'R'; g.T = CATCH_T[g.round-1];
  g.t0 = now(); g.tapAt = null; g.result = null; g.phase = 'fly'; g.say = tr('game.prompt');
  hudAt = 0; renderGame();
  setTimeout(() => resolveThrow(g), g.T + 420);
}
function gameTap(){
  const g = game;
  if (!g || g.kind !== 'spot' || g.phase !== 'fly' || g.tapAt != null) return;
  g.tapAt = now() - g.t0; sfx('tap');                                    // solo cuenta el primer toque de cada pelota
}
function resolveThrow(g){
  if (game !== g) return;
  const ok = g.tapAt != null && Math.abs((g.tapAt + JUMP_LEAD) - g.T) <= 150;
  g.result = ok ? 'catch' : 'miss'; g.phase = 'result'; g.resAt = now(); if (ok) g.wins++;
  g.say = tr(ok ? 'game.catch' : 'game.missed'); sfx(ok ? 'happy' : 'no'); hudAt = 0; renderGame();
  setTimeout(() => nextThrow(g), 1100);
}

/* -- Kush: cazar ratones oyendo o viendo -- */
function startKushGame(){
  const g = game = { kind:'kush', round:0, wins:0, mode:'see', prey:null, cool:0, say:tr('kgame.prompt') };
  hudAt = 0; renderGame(); setTimeout(() => nextPrey(g), 900);
}
function nextPrey(g){
  if (game !== g) return;
  if (g.round >= 5) return finishGame();
  g.round++;
  g.prey = { zone:Math.floor(Math.random()*3), type:Math.random() < .5 ? 'see' : 'hear', t0:now(),
             dur:[2800,2600,2400,2200,2000][g.round-1], done:false, caught:false };
  g.say = tr('kgame.prompt'); hudAt = 0; renderGame();
  g.preyTimer = setTimeout(() => endPrey(g, false), g.prey.dur);
}
function endPrey(g, caught){
  if (game !== g || !g.prey || g.prey.done) return;
  const pr = g.prey; pr.done = true; pr.caught = caught; pr.endAt = now(); clearTimeout(g.preyTimer);
  if (caught) g.wins++;
  g.say = tr(caught ? 'kgame.got' : 'kgame.escaped'); sfx(caught ? 'happy' : 'no'); hudAt = 0; renderGame();
  setTimeout(() => { if (game === g) { g.prey = null; nextPrey(g); } }, 1000);
}
function setMode(m){
  const g = game; if (!g || g.kind !== 'kush' || g.mode === m) return;
  g.mode = m; sfx('tap'); renderGame();
}
function pounce(z){

function toggleLight(){

  if (isKush()) {
    // A Kush NO se le despierta cuando uno quiere: solo si su barra de energía está llena (y no se le avisa a nadie).
    // Si no, abre un ojo un instante y sigue durmiendo. Despierta por su cuenta cuando se hace de noche.
    const k = S.k;
    if (kushAsleep()) {
      if (k.energy >= 99) { k.nap = false; k.wokenUntil = now() + 2*3600*1000; sfx('mew'); hudAt = 0; save(); }

  }

  else if (S.energy >= 85) { startAnim('no', 900); return toast(tr('t.notSleepy')); }
  else { S.sleeping = true; toast(tr('t.goodnight')); }
  hidePane(); save();
}

  p.poops = 0; p.sickAcc = Math.max(0, p.sickAcc - 40); p.happy = clamp(p.happy + 5);

function petSpot(){

/* ---------- Kush (la gatita negra) ----------
   Duerme de día y despierta de noche según el RELOJ del aparato (?hour=14 fuerza la hora, para probar).
   Se duerme sola si le queda poca energía y NO se le despierta a voluntad (secreto: solo con la barra llena).
   Su entrada es siempre la misma: noche cerrada → dos ojos → rayo → la noche se despeja y ahí está. */
const KUSH_NIGHT = [19, 6];                                   // de las 19:00 a las 6:00 es de noche
const FORCE_HOUR = params.has('hour') ? +params.get('hour') : null;
const hourNow = () => FORCE_HOUR ?? new Date().getHours();
const clockNight = () => hourNow() >= KUSH_NIGHT[0] || hourNow() < KUSH_NIGHT[1];
const KUSH_TIRED = 15;                                        // con tan poca energía se duerme sola
const isNight = () => clockNight();                           // el escenario sigue al reloj
// Duerme de día (salvo que la hayan despertado con la barra llena) y también cuando se queda sin energía
const kushAsleep = () => S.k.nap || (!clockNight() && now() >= (S.k.wokenUntil || 0));
const INTRO_MS = 4300;
let kushIntro = null;
function startKushIntro(){ kushIntro = { t0: now(), s1:false, s2:false, s3:false }; }
function syncChars(){
  document.querySelectorAll('[data-char]').forEach(b => {
    const on = b.dataset.char === S.char; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  hudAt = 0;
}
function setChar(c){
  if (c === S.char) return;
  S.char = c; hidePane(); save();
  if (c === 'kush') startKushIntro(); else kushIntro = null;
  syncChars();
}
document.querySelectorAll('[data-char]').forEach(b => { b.onclick = () => setChar(b.dataset.char); });
function petKush(){
  if (kushIntro) { kushIntro = null; return; }                 // tocar la pantalla salta la intro
  if (kushAsleep()) { startAnim('kushpeek', 1300); toast(tr('t.kushSleeping')); return; }
  startAnim('kushpet', 1600); spawnHearts(2); sfx('mew'); S.k.happy = clamp(S.k.happy + 2); save();
}

let ac = null;
const SFX = {
  mew:[[880,.07,'sine'],[1175,.09,'sine'],[760,.14,'sine']], squeak:[[1500,.04,'sine'],[1900,.05,'sine']],
  tap:[[660,.07]], bark:[[420,.09,'sawtooth'],[300,.12,'sawtooth']], eat:[[500,.06],[620,.06],[500,.06],[620,.06]],
  happy:[[523,.08],[659,.08],[784,.12]], no:[[200,.16],[160,.2]], fanfare:[[523,.1],[659,.1],[784,.1],[1047,.28]],
};
function sfx(name){
  if (S.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (name === 'thunder') {                    // ruido que se apaga + filtro grave = trueno
      const len = Math.floor(ac.sampleRate * .9), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; fl.type = 'lowpass'; fl.frequency.value = 520; g.gain.value = .5;
      src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start(); return;
    }
    let t = ac.currentTime;
    for (const [f,d,type] of SFX[name]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); t += d * .9;
    }
  } catch(e){}
}

/* =====================================================================
   DIBUJO  (pixel art 64×64, todo por código)
   ===================================================================== */
const W = 64;
const cv = $('#cv'), ctx = cv.getContext('2d');
const img = ctx.createImageData(W, W), OUT = new Uint32Array(img.data.buffer);
const SCENE = new Uint32Array(W*W), LAYER = new Uint32Array(W*W);
let T = SCENE, ONLY = null;

const col = hex => { const n = parseInt(hex.slice(1), 16); return ((255<<24) | ((n&255)<<16) | (n&0xff00) | (n>>16)) >>> 0; };
const put = (x,y,c) => { x|=0; y|=0; if (x<0||y<0||x>=W||y>=W) return; const i=y*W+x; if (ONLY!==null && T[i]!==ONLY) return; T[i]=c; };
const rect = (x,y,w,h,c) => { for (let j=0;j<h;j++) for (let i=0;i<w;i++) put(x+i,y+j,c); };
function ell(cx,cy,rx,ry,c){
  for (let y=Math.floor(cy-ry); y<=Math.ceil(cy+ry); y++) for (let x=Math.floor(cx-rx); x<=Math.ceil(cx+rx); x++) {
    const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if (dx*dx+dy*dy<=1) put(x,y,c);
  }
}
function inPoly(p,x,y){
  let c=false; for (let i=0,j=p.length-1;i<p.length;j=i++){
    const [xi,yi]=p[i],[xj,yj]=p[j];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  } return c;
}
function poly(p,c){
  const xs=p.map(a=>a[0]), ys=p.map(a=>a[1]);
  for (let y=Math.floor(Math.min(...ys)); y<=Math.ceil(Math.max(...ys)); y++)
    for (let x=Math.floor(Math.min(...xs)); x<=Math.ceil(Math.max(...xs)); x++)
      if (inPoly(p,x+.5,y+.5)) put(x,y,c);
}
function outline(c){
  const add=[];
  for (let y=0;y<W;y++) for (let x=0;x<W;x++) {
    const i=y*W+x; if (T[i]) continue;
    if ((x>0&&T[i-1])||(x<W-1&&T[i+1])||(y>0&&T[i-W])||(y<W-1&&T[i+W])) add.push(i);
  }
  for (const i of add) T[i]=c;
}
function bmp(rows,x,y,map){
  rows.forEach((r,j)=>{ for (let i=0;i<r.length;i++) { const ch=r[i]; if (ch!=='.'&&map[ch]) put(x+i,y+j,map[ch]); } });
}

/* paleta */
const C = {
  fur:col('#fffdf5'), furSh:col('#f1e7c8'), ink:col('#1b2147'), eyeHi:col('#ffffff'), eyeHi2:col('#7d88c4'),

  poop:col('#8a5a2b'), poopHi:col('#b98450'), meat:col('#c9803a'), bone:col('#fff8e6'), boneDk:col('#d9c79a'), kibble:col('#b87a3d'),
  green:col('#5fd37a'), ball:col('#ff6a4d'), ballHi:col('#ffd0c4'),
  eggSpot:col('#cfe6f5'), eggPink:col('#f9d6e0'),
};
const PAL = {
  day:  { sky:['#7fcdee','#98d9f2','#b4e4f6','#cdeef8'].map(col), cloud:col('#fffbef'), cloudSh:col('#e6dbbb'), fur:C.fur, furSh:C.furSh, line:C.lineSoft,
          wisp:{ core:col('#fff8d6'), mid:col('#e4d8ff'), tip:col('#b7a0ff') }, glow:col('#f3efff') },
  night:{ sky:['#121838','#19214b','#222c5f','#2c3874'].map(col), cloud:col('#8f9ac8'), cloudSh:col('#6a76a6'), fur:col('#ece9f6'), furSh:col('#cdcae3'), line:col('#3a4272'),
          wisp:{ core:col('#e9e6ff'), mid:col('#b4acea'), tip:col('#7a72c6') }, glow:col('#4a539e') },
};
const STARS = [[6,6],[15,14],[24,5],[40,9],[52,3],[59,17],[48,23],[9,25],[33,16],[20,27]];

function drawScene(pal,t,fr,night,poops){
  T = SCENE;
  const bands=[0,15,30,44,64];
  for (let y=0;y<W;y++){
    let b=0; while (y>=bands[b+1]) b++;
    const nxt = pal.sky[Math.min(b+1,3)];
    for (let x=0;x<W;x++){
      const nearEdge = b<3 && y>=bands[b+1]-2;
      SCENE[y*W+x] = nearEdge && ((x+y)&1) ? nxt : pal.sky[b];
    }
  }
  if (night) {
    STARS.forEach(([x,y],i)=>{ if ((i+fr)%6) put(x,y,C.white); else put(x,y,col('#8f9ac8')); });
    ell(53,11,5.2,5.2,col('#fff3c4')); ell(55.5,9.5,4.4,4.4,pal.sky[0]);
  }
  const cloud=(cx,cy,s)=>{
    for (const [c,dy] of [[pal.cloudSh,1],[pal.cloud,0]]) {
      ell(cx,cy+dy,9*s,4.2*s,c); ell(cx-6*s,cy+1+dy,5*s,3*s,c); ell(cx+6*s,cy+1+dy,6*s,3.2*s,c); ell(cx-1*s,cy-3*s+dy,5*s,4*s,c);
    }
  };
  cloud(((6+t*1.1)%84)-14, 12, 1); cloud(((44+t*.7)%84)-14, 24, .75); cloud(((70+t*1.6)%84)-14, 6, .6);
  for (const [c,dy] of [[pal.cloudSh,1],[pal.cloud,0]]) {
    [[4,58,11,7],[17,60,10,6],[30,58,12,7],[45,60,11,7],[58,58,10,7]].forEach(([x,y,rx,ry])=>ell(x,y+dy,rx,ry,c));
    rect(0,60+dy,W,4,c);
  }
  // popós sobre la nube
  const spots=[[15,52],[46,54],[22,55]];
  for (let i=0;i<Math.min(poops|0,3);i++) bmp(['...x...','..xhx..','.xxxhx.','xxxxxxx'],spots[i][0],spots[i][1],{x:C.poop,h:C.poopHi});
}

function drawEgg(p,pal){

  if (S.hatchTaps >= 2) { [[cx-2,24],[cx-1,25],[cx,26],[cx-1,27]].forEach(([x,y])=>put(x,y,C.ink)); }
  if (S.hatchTaps >= 4) { [[cx+3,26],[cx+4,27],[cx+3,28],[cx+5,29]].forEach(([x,y])=>put(x,y,C.ink)); }

function sparkle(x,y,big){
  put(x,y,C.white); put(x-1,y,C.goldHi); put(x+1,y,C.goldHi); put(x,y-1,C.goldHi); put(x,y+1,C.goldHi);
  if (big){ put(x-2,y,C.goldHi); put(x+2,y,C.goldHi); put(x,y-2,C.goldHi); put(x,y+2,C.goldHi); }
}
function flame(cx,base,h,fr,ph){
  const w = Math.sin(fr*1.1+ph)*1.6, w2 = Math.cos(fr*.9+ph)*1.2;
  poly([[cx-5,base],[cx-4,base-h*.45],[cx-1+w,base-h*.8],[cx+w2,base-h],[cx+2+w,base-h*.7],[cx+4,base-h*.4],[cx+5,base]], C.flameA);
  poly([[cx-3,base],[cx-2.5,base-h*.4],[cx+w*.6,base-h*.75],[cx+2.5,base-h*.4],[cx+3,base]], C.flameB);
  poly([[cx-1.5,base],[cx+w*.3,base-h*.45],[cx+1.5,base]], C.white);
}

/* Spot es una llama blanca de plasma: el borde de su pelaje lame hacia arriba y a los lados */
function flameEdge(pal,t,flare){
  const n = (a,b) => Math.sin(a*.4+b*9)*.5 + Math.sin(a*.9-b*13)*.3 + Math.sin(a*.17+b*5)*.2;      // -1..1
  const { core, mid, tip } = pal.wisp;
  const sway = Math.sin(t*2.4)*.6 + Math.sin(t*5.1)*.25;          // la corona entera se inclina como con viento
  const lick = (x,y,dx,dy,h,lx,ly) => {
    const at = i => [x+dx*i+Math.round(lx*i), y+dy*i+Math.round(ly*i)];
    for (let i=0;i<=h;i++){ const [px,py]=at(i); put(px,py, i===h && h>0 ? tip : (h>1 && i===h-1 ? mid : core)); }
    if (h>1 && Math.sin(x*3.1+y*2.3+t*17) > .55){ const [px,py]=at(h+1); put(px,py,tip); }          // chispita en la punta
  };
  // arriba: para cada columna, la primera casilla ocupada es el contorno
  for (let x=0;x<W;x++){
    let y=0; while (y<W && !LAYER[y*W+x]) y++;
    if (y>=W || y>50) continue;
    lick(x,y,0,-1, Math.max(0, Math.min(6, Math.round((1.5+2.4*n(x,t))*flare))), sway, 0);
  }
  // costados (solo la parte alta y media; abajo toca la nube)
  for (let y=0;y<50;y++){
    let x0=0; while (x0<W && !LAYER[y*W+x0]) x0++;
    if (x0>=W) continue;
    let x1=W-1; while (x1>=0 && !LAYER[y*W+x1]) x1--;
    const ml = Math.max(0, Math.min(3, Math.round((.5+1.7*n(y*1.7,t+3))*flare)));
    const mr = Math.max(0, Math.min(3, Math.round((.5+1.7*n(y*1.7+40,t+7))*flare)));
    lick(x0,y,-1,0,ml,0,-.7); lick(x1,y,1,0,mr,0,-.7);       // los costados se curvan hacia arriba
  }
}
/* resplandor tenue (tramado) alrededor de Spot */
function glow(pal,fr){
  const add=[];
  for (let y=0;y<W;y++) for (let x=0;x<W;x++){
    if (LAYER[y*W+x] || (x&1) || ((y+(fr>>1))&1)) continue;      // ~25% de las casillas: resplandor sutil
    let near=false;
    for (let j=-2;j<=2 && !near;j++) for (let i=-2;i<=2;i++){
      const xx=x+i, yy=y+j; if (xx>=0&&yy>=0&&xx<W&&yy<W&&LAYER[yy*W+xx]){ near=true; break; }
    }
    if (near) add.push(y*W+x);
  }
  for (const i of add) LAYER[i]=pal.glow;
}

function drawDog(p,pal,st,fr,t){

  if (p.spot) {                                                               // LA MANCHA: de ahí le viene el nombre; se mueve según cómo se siente

  // ---- cara
  const eye=(cx,k,left)=>{

/* ---------- animaciones y partículas ---------- */
let A = null; const parts = [];
function startAnim(type,dur,extra){ A = Object.assign({ type, t0:now(), dur }, extra||{}); }
function curAnim(){ if (A && now() > A.t0 + A.dur) A = null; return A; }
function spawnHearts(n){ for (let i=0;i<n;i++) parts.push({ t0:now()+i*160, x:24+Math.random()*16, y:16 }); }

/* Postura al comer (la usan Spot y Kush). e = ms desde que empezó la animación. */
function eatPose(a, e, fr){
  const q = { eyes:'happy', mouth:'chew', tongue:false, look:0, jump:0, shake:0 };
  const chew = (fr%2) ? 'chew' : 'smile';
  switch (a.food) {
    case 'kibble':                                   // las croquetas caen a la boca
      if (e < 700) { q.eyes = 'open'; q.mouth = 'open'; } else q.mouth = chew;
      break;
    case 'chicken': {                                // muerde el muslo: abre, cierra, abre…
      if (e < 600) { q.eyes = 'open'; q.mouth = 'open'; }
      else { const ph = (e - 600) % 640; q.mouth = ph < 260 ? 'open' : 'chew'; q.eyes = ph < 260 ? 'open' : 'happy'; }
      break;
    }
    case 'bone':                                     // lo ROE: mueve la cabeza de lado a lado
      if (e < 450) { q.eyes = 'open'; q.mouth = 'open'; }
      else { q.look = Math.floor(e / 380) % 2 ? 1 : -1; q.mouth = chew; }
      break;
    case 'sausage':                                  // slurp de espagueti
      if (e < 1000) { q.eyes = 'open'; q.mouth = 'open'; q.tongue = true; }
      else if (e < 2500) { q.eyes = 'open'; q.mouth = (fr%2) ? 'open' : 'chew'; }
      else q.mouth = chew;
      break;
    case 'icecream':                                 // lame, lame… ¡y le da el congelamiento!
      if (e < 500) { q.eyes = 'open'; q.mouth = 'smile'; q.look = 1; }
      else if (e < 2700) { q.look = 1; q.mouth = 'smile'; q.lick = true; }
      else { q.eyes = 'xd'; q.mouth = 'open'; q.shake = (fr%2) ? 1 : -1; }
      break;
    case 'tuna':                                     // la pescadilla cae y se la come de la cabeza a la cola
      if (e < 600) { q.eyes = 'open'; q.mouth = 'open'; } else { q.mouth = chew; q.eyes = (fr%6 < 4) ? 'happy' : 'open'; }
      break;
    case 'ham':                                      // tres mordiscos
      if (e < 500) { q.eyes = 'open'; q.mouth = 'open'; }
      else { const ph = (e - 900) % 700; q.mouth = (e > 900 && ph < 260) ? 'open' : 'chew'; }
      break;
    case 'shrimp':                                   // zarpazo al camarón que brinca
      if (e < 900) {
        q.eyes = 'open'; q.mouth = 'open'; q.look = 1;
        if (e > 600) { const s = Math.sin(Math.PI * (e - 600) / 300); q.jump = s * 6; q.dx = s * 5; }
      } else q.mouth = chew;
      break;
    case 'milk':                                     // lap, lap, lap…
      q.eyes = 'closed'; q.mouth = (Math.floor(e / 280) % 2) ? 'open' : 'chew';
      break;
    case 'pizza':                                    // la atrapa al vuelo y ¡chomp!
      if (e < 950) {
        q.eyes = 'open'; q.mouth = 'open'; q.tongue = true; q.look = 1;
        if (e > 650) q.jump = Math.sin(Math.PI * (e - 650) / 300) * 6;
      } else if (e < 1200) { q.eyes = 'happy'; q.mouth = 'smile'; }
      else { q.eyes = 'xd'; q.mouth = chew; }
      break;
  }
  return q;
}

function pose(fr,t){
  const m = mood(), a = curAnim();
  const p = { eyes:'open', mouth:'smile', tongue:false, earDrop:0, tail:0, blush:false, shake:0, jump:0, headBob:(fr%4<2)?0:1, wobble:0, flare:1, look:0 };
  p.flare = stageOf()==='dios' ? 1.25 : 1;      // la forma divina arde más
  const wag = sp => [0,1,2,1][(fr*sp)%4];
  switch (m) {
    case 'happy':  p.mouth='open'; p.tongue=(fr%4<2); p.blush=true; p.tail=wag(2); p.flare*=1.25; break;
    case 'ok':     p.tail=wag(1); break;
    case 'hungry': p.mouth='frown'; p.eyes='sad'; p.earDrop=2; p.flare*=.65; break;
    case 'sad':    p.mouth='frown'; p.eyes='sad'; p.earDrop=3; p.flare*=.55; break;
    case 'sleepy': p.eyes=(fr%8<6)?'half':'closed'; p.earDrop=1; p.flare*=.7; break;
    case 'sick':   p.eyes='x'; p.mouth='frown'; p.earDrop=3; p.shake=(fr%2)?1:0; p.flare*=.45; break;
    case 'sleep':  p.eyes='closed'; p.mouth='sleep'; p.earDrop=1; p.headBob=(fr%8<4)?0:1; p.flare*=.4; break;
  }
  // ¡Spot es el dios del XD! Cada tanto se desternilla: ojos >< y bocota (feliz: ~la mitad del tiempo; normal: de vez en cuando)
  const xdBurst = (m==='happy' && (t % 8) < 4.2) || (m==='ok' && (t % 12) < 2.6);
  if (xdBurst) { p.eyes='xd'; p.mouth='xd'; p.blush=true; p.shake=(fr%2)?1:-1; p.flare*=1.3; p.tail=wag(2); p.earDrop=0; }
  if (p.eyes==='open' && fr%26===0) p.eyes='closed';

  const g = (game && game.kind === 'spot') ? game : null;
  if (g) {                                       // minijuego: Spot espera la pelota, salta y la atrapa
    p.flare = Math.max(p.flare, 1.4); p.tail = wag(2); p.earDrop = 0; p.shake = 0;
    if (g.phase === 'fly') {
      p.eyes = 'open'; p.mouth = 'open'; p.look = g.side === 'L' ? -1 : 1;
      if (g.tapAt != null) { const jt = (now() - g.t0) - g.tapAt; if (jt >= 0 && jt < JUMP_MS) p.jump = Math.sin(Math.PI * jt / JUMP_MS) * 7; }
    } else if (g.phase === 'result') {
      if (g.result === 'catch') { p.eyes = 'xd'; p.mouth = 'xd'; p.shake = (fr%2) ? 1 : -1; p.blush = true; }
      else { p.eyes = 'sad'; p.mouth = 'frown'; p.earDrop = 2; }
    } else { p.eyes = 'open'; p.mouth = 'smile'; }
  }
  if (a) {
    const e = now() - a.t0;
    switch (a.type) {
      case 'pet':   p.eyes='xd'; p.mouth='xd'; p.blush=true; p.shake=(fr%2)?1:-1; p.tail=wag(2); p.earDrop=0; p.flare=Math.max(p.flare,1.6); break;
      case 'play':  p.eyes='xd'; p.mouth='xd'; p.blush=true; p.tail=wag(2); p.earDrop=0; p.jump=Math.abs(Math.sin(e/110))*5; p.flare=Math.max(p.flare,1.6); break;
      case 'eat':   { const q = eatPose(a,e,fr); Object.assign(p, q); p.earDrop=0; p.tail=wag(2); p.blush = q.eyes!=='open'; if (q.eyes==='xd') p.flare*=1.3; break; }
      case 'clean': p.eyes='happy'; p.mouth='smile'; p.blush=true; p.earDrop=0; p.tail=wag(2); break;
      case 'med':   p.eyes='closed'; p.mouth='smile'; p.earDrop=0; break;
      case 'no':    p.shake=(Math.floor(e/90)%2)?1:-1; p.mouth='frown'; break;
      case 'evolve':p.eyes='xd'; p.mouth='xd'; p.tail=wag(2); p.earDrop=0; p.jump=Math.abs(Math.sin(e/160))*4; break;
      case 'hatch': p.eyes='xd'; p.mouth='xd'; p.tail=wag(2); p.earDrop=0; break;
      case 'wobble':p.wobble=(fr%2)?1:-1; break;
    }
  }
  // La mancha negra de Spot (de ahí su nombre) se mueve según lo que siente
  let sp;
  if (p.eyes === 'xd') sp = { x:35+Math.sin(t*14)*3, y:49.2+Math.sin(t*18)*1.2, rx:4.2, ry:2.7 };            // de risa: se sacude y se infla
  else if (g && g.phase === 'fly') sp = { x:34+Math.sin(t*8)*3, y:45, rx:3.6, ry:2.8 };                         // emocionado con la pelota
  else if (a && a.type === 'eat') sp = { x:35, y:47.5, rx:3.2+((fr%2)?.9:0), ry:2.6+((fr%2)?.5:0) };            // late con cada bocado
  else switch (m) {
    case 'happy':  sp = { x:34+Math.sin(t*2.4)*4.5, y:46+Math.sin(t*4.8)*1.6, rx:3.6+Math.sin(t*6)*.5, ry:2.8 }; break;   // pasea feliz por la panza
    case 'hungry': sp = { x:35, y:50, rx:2.1, ry:1.4 }; break;                                                         // se encoge y se hunde
    case 'sad':    sp = { x:33, y:51, rx:2.4, ry:1.3 }; break;
    case 'sleepy': sp = { x:37, y:48, rx:2.8, ry:2 }; break;
    case 'sleep':  sp = { x:37, y:47.5, rx:3+Math.sin(t*1.8)*.4, ry:2.2+Math.sin(t*1.8)*.3 }; break;                // respira con él
    case 'sick':   sp = { x:36+Math.sin(t*9)*1.6, y:47+Math.cos(t*7)*1.2, rx:2+Math.sin(t*11)*.7, ry:1.6 }; break;  // se marea
    default:       sp = { x:37+Math.sin(t*1.3)*1.2, y:46+Math.sin(t*2)*.5, rx:3.2, ry:2.6 };                         // tranquilo: se mece
  }
  p.spot = sp;
  if (p.eyes === 'xd') p.jump = Math.max(p.jump || 0, (fr%2) ? 1 : 0);                                          // la risa lo hace rebotar
  return p;
}

function drawFood(a, e, fr, mx, my){
  T = LAYER;
  switch (a.food) {
    case 'kibble': {                                  // lluvia de croquetas
      if (e < 700) {
        const k = e / 700, x = Math.round(mx + 13 - 13*k), y = Math.round(my - 28 + 26*k);
        rect(x,y,2,2,C.kibble); rect(x+3,y+2,2,2,C.kibble); rect(x-2,y+3,2,2,C.kibble);
      }
      break;
    }
    case 'chicken': {                                 // muslo que se acerca y se va acabando a mordidas
      const total = 2500;
      let x, y, bite = 0;
      if (e < 600) { const k = e / 600; x = mx + 13 - 12*k; y = my - 24 + 22*k; }
      else { x = mx + 1; y = my - 2; bite = Math.min(1, (e - 600) / 1900); }
      if (e < total + 400) drumstick(Math.round(x), Math.round(y + Math.max(0,(e - total)/400) * 16), bite);   // al final cae el huesito
      break;
    }
    case 'bone': {                                    // el hueso cae entre las patitas y se lo pone a roer
      const k = Math.min(1, e / 450), y = Math.round(-4 + (my + 8) * k), sx = e > 450 ? (Math.floor(e/90)%2 ? 1 : 0) : 0;
      if (e < 3200) {
        const bx = mx - 5 + sx, parts = [[bx,y,2,2],[bx+7,y,2,2],[bx,y+4,2,2],[bx+7,y+4,2,2],[bx+1,y+1,7,4]];   // 4 puntas + el cuerpo
        for (const [x,yy,w,h] of parts) rect(x-1,yy-1,w+2,h+2,F.boneLine);                                     // contorno (si no, se pierde en el pelaje)
        for (const [x,yy,w,h] of parts) rect(x,yy,w,h,F.bone);
        rect(bx+1,y+4,7,1,F.boneSh);
        if (e > 450 && fr%2) { put(bx-2,y-2,C.white); put(bx+10,y+1,C.white); put(bx+4,y-3,C.goldHi); }   // astillitas
      }
      break;
    }
    case 'sausage': {                                 // baja del cielo y se la sorbe como espagueti
      // entra por la derecha, por debajo de los ojos (no le tapa la cara), y se la va sorbiendo como espagueti
      const S0 = [mx + 28, my - 6], M = [mx + 1, my - 1];
      const P = u => [S0[0] + (M[0]-S0[0])*u, S0[1] + (M[1]-S0[1])*u];
      const k1 = Math.min(1, e / 900), k2 = e < 900 ? 0 : Math.min(1, (e - 900) / 1500);
      const uBot = k1, uTop = k2 > 0 ? .45 + .55*k2 : Math.max(0, k1 - .55);
      if (k2 < 1 && uTop < uBot - .02) {
        const wob = Math.sin(e/80) * (.6 + k2), [x0,y0] = P(uTop), [x1,y1] = P(uBot);
        thickLine(x0 + wob, y0, x1, y1, F.sausage, 3);
        thickLine(x0 + wob - 1, y0 - 1, x1 - 1, y1 - 1, F.sausageHi, 1);
        for (let u = uTop + .06; u < uBot; u += .13) { const [gx,gy] = P(u); put(gx + 1, gy + 1, F.sausageDk); put(gx - 1, gy + 1, F.sausageDk); }   // los gajos
      }
      break;
    }
    case 'icecream': {                                // cono a un lado; lame; al final, congelamiento cerebral
      const rise = Math.min(1, e / 500), cx = mx + 12, cy = Math.round(my - 6 + (1 - rise) * 22);
      const lickP = Math.max(0, Math.min(1, (e - 500) / 2200)), r = 4.4 * (1 - .7 * lickP);
      if (e < 3500) {
        poly([[cx-3.5,cy+3],[cx+3.5,cy+3],[cx,cy+13]], F.cone);
        put(cx-1,cy+6,F.coneDk); put(cx+1,cy+6,F.coneDk); put(cx,cy+9,F.coneDk); put(cx,cy+4,F.coneDk);
        ell(cx, cy, r, r*.85, F.scoop);
        if (r > 1.5) { put(cx-1,cy-1,C.white); put(cx,cy-Math.round(r)-1,F.cherry); }
        if (e >= 500 && e < 2700 && Math.floor(e/330)%2) thickLine(mx+2, my+1, cx - Math.max(1,r) + 1, cy + 1, C.tongue, 2);   // lengüetazo
      }
      if (e >= 2700) {                                // ¡congelamiento!: rayitas azules y copos
        for (let i=0;i<4;i++) { const x = mx - 14 + i*9, y = my - 31 - (fr+i)%3; rect(x,y,1,3,F.ice); }
        sparkle(mx-15, my-22+(fr%3), false); sparkle(mx+16, my-24-(fr%2), true);
      }
      break;
    }
    case 'tuna': {                                    // el pescado cae a sus patitas y se lo come de la cabeza a la cola; quedan las espinas
      const drop = Math.min(1, e / 600), cy = Math.round(-4 + (my + 11) * drop), fx = mx - 1;
      const cut = (mx - 9) + (e < 600 ? 0 : Math.min(1, (e - 600) / 2300)) * 19;
      if (e < 3300) {
        rect(fx-6,cy,12,1,C.white); for (let i=0;i<4;i++) rect(fx-4+i*3,cy-2,1,5,C.white);
        poly([[fx+5.5,cy],[fx+9,cy-2.5],[fx+9,cy+2.5]],C.white); ell(fx-7,cy,1.8,1.5,C.white);            // las espinas
        FOODB.fill(0); T = FOODB;
        ell(fx,cy,6.5,2.7,F.tuna); ell(fx,cy+1.2,5.6,1.1,F.tunaBelly);
        poly([[fx+5.5,cy],[fx+10,cy-3.5],[fx+10,cy+3.5]],F.tuna); put(fx-4,cy-1,C.ink);
        T = LAYER;
        for (let i=0;i<W*W;i++) if (FOODB[i] && (i % W) >= cut) LAYER[i] = FOODB[i];                    // solo lo que aún no se ha comido
      }
      break;
    }
    case 'ham': {                                     // una lonja de jamón que se acaba en tres mordiscos
      const slide = Math.min(1, e / 500), x = Math.round(mx - 5 + (1 - slide) * 20), y = my + 11;
      const bites = e < 900 ? 0 : e < 1600 ? 1 : e < 2300 ? 2 : 3, w = [10, 7, 4, 0][bites];
      if (w > 0) { rect(x-1,y-1,w+2,7,F.hamDk); rect(x,y,w,5,F.ham); rect(x,y,w,1,F.hamFat); put(x+2,y+3,F.hamDk); if (w > 5) put(x+6,y+2,F.hamDk); }
      if (e > 900 && (e - 900) % 700 < 140) { put(x+w+1,y+1,F.ham); put(x+w+2,y+3,F.hamFat); }          // migajas
      break;
    }
    case 'shrimp': {                                  // el camarón brinca desde la derecha y Kush lo atrapa de un zarpazo
      if (e < 900) {
        const k = e / 900, x = 60 - (60 - (mx + 4)) * k, y = 50 + (my - 50) * k - 30 * 4 * k * (1 - k);
        shrimpSprite(Math.round(x), Math.round(y), fr);
      } else if (e < 1100) sparkle(mx + 2, my - 2, true);
      break;
    }
    case 'milk': {                                    // plato de leche entre sus patitas: lap, lap, lap… ¡y bigote de leche!
      const slide = Math.min(1, e / 400), y = my + 16 + Math.round((1 - slide) * 8);
      const lvl = 1 - Math.min(1, Math.max(0, (e - 400) / 2300)) * .75;
      ell(mx,y,8.5,2.3,F.saucerDk); ell(mx,y-.3,8,2,F.saucer); ell(mx,y-.6,6.6 * lvl + 1,1.4,F.milk);
      if (e > 400 && Math.floor(e / 280) % 2) { thickLine(mx,my+1,mx,my+4,C.tongue,2); put(mx-3,y-3,F.milk); put(mx+4,y-2,F.milk); }   // lengüetazo + salpicaduras
      if (e > 2600) { rect(mx-4,my-1,3,1,F.milk); rect(mx+2,my-1,3,1,F.milk); }                            // bigote de leche
      break;
    }
    case 'pizza': {                                   // la rebanada vuela por el aire hasta su boca
      if (e < 950) {
        const k = e / 950, sx = mx + 30, x = sx + (mx - sx) * k, y = (my - 6) + 4 * k - 26 * 4 * k * (1 - k);
        pizzaSlice(Math.round(x), Math.round(y));
      } else if (e < 1150) sparkle(mx, my - 2, true);   // ¡chomp!
      break;
    }
  }
}

function drawEffects(pal,p,fr,t,st){

  }

      const k = Math.max(0,1-e/(a.type==='hatch'?900:700));
      if (k>0 && a.type==='hatch') { for (let i=0;i<W*W;i++) if (((i%W)+((i/W)|0)+fr)%2===0 || k>.6) LAYER[i]=C.white; }
      for (let i=0;i<6;i++){ const ang=i/6*Math.PI*2+e/300, r=10+e/60%14; sparkle(Math.round(32+Math.cos(ang)*r),Math.round(32+Math.sin(ang)*r*.8),i%2===0); }
    }
  }
  // chispas de plasma que se desprenden de Spot y suben
  if (st!=='egg'){
    const cols = S.sleeping ? [C.goldHi, col('#9d96e0')] : [col('#ffe9a0'), col('#cdb9ff'), C.white];
    const amount = S.sleeping ? 3 : 7;
    for (let i=0;i<amount;i++){

}

function drawHearts(){

    const h=parts[i], e=now()-h.t0; if (e<0) continue; if (e>1600){ parts.splice(i,1); continue; }
    bmp(['.x.x.','xxxxx','.xxx.','..x..'],Math.round(h.x+Math.sin(e/200)*2),Math.round(h.y-e/1600*14),{x:C.heart});

/* pelota: sombra + cuerpo con raya que gira */
function drawBall(x,y,fr,shadowY,shadowC){
  ell(x,shadowY,3.6-Math.min(2,Math.max(0,(shadowY-y)/14)),1,shadowC);
  ell(x,y,3.6,3.6,col('#a63a2a')); ell(x,y,3,3,C.ball);
  if (fr%2) rect(Math.round(x)-3,Math.round(y),6,1,C.ballHi); else rect(Math.round(x),Math.round(y)-3,1,6,C.ballHi);
  put(x-1,y-1,C.white);
}
/* La pelota entra volando desde el lado g.side hacia la boca de Spot; si no la atrapa, sigue de largo y rebota. */
function drawGameBall(pal,t,fr){
  const g = game; T = LAYER;
  if (!g || g.kind !== 'spot' || g.phase === 'idle') return;
  const e = now() - g.t0, s = g.side === 'L' ? -1 : 1, sx = g.side === 'L' ? 2 : 62, tx = 33, ty = 36;
  if (e < g.T) {
    const k = e / g.T;
    drawBall(sx + (tx - sx) * k, 20 + (ty - 20) * k - 14 * 4 * k * (1 - k), fr, 55, pal.cloudSh);
  } else if (g.result !== 'catch' && g.phase !== 'idle') {          // se le escapó: sigue y cae al piso del otro lado
    const m = Math.min(1, (e - g.T) / 800);
    drawBall(tx - s * 30 * m, ty + (52 - ty) * Math.min(1, m * 1.6) - Math.max(0, m - .6) * 6 * (1 - m), m < 1 ? fr : 0, 55, pal.cloudSh);
  }
}

/* =====================================================================
   KUSH — gatita negra. Despierta de noche, dormida (hecha bolita) de día.
   ===================================================================== */
const K = {
  body:col('#262338'), hi:col('#3b3757'), outDay:col('#0d0b17'), outNight:col('#8f87d6'),
  eye:col('#ffe14d'), eyeDk:col('#0d0b17'), earIn:col('#6b4a80'), nose:col('#e690a8'),
  soft:col('#8b84b8'), whisk:col('#6f679a'), z:col('#6b63c8'), mouthIn:col('#5a1f2e'),
  mouse:col('#c9c2d8'), mouseTail:col('#e690a8'), ring:col('#cfd8ff'), ringFar:col('#8f9be0'),
};
function thickLine(x0,y0,x1,y1,c,th){
  const n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0), 1) * 2;
  for (let i=0;i<=n;i++) { const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n; if (th<=1) put(x,y,c); else ell(x,y,th/2,th/2,c); }
}
function shiftLayer(dx,dy){                 // mueve todo el sprite (para los saltos y el zarpazo de Kush)
  dx = Math.round(dx); dy = Math.round(dy); if (!dx && !dy) return;
  const src = LAYER.slice(); LAYER.fill(0);
  for (let y=0;y<W;y++) for (let x=0;x<W;x++) { const c = src[y*W+x]; if (!c) continue; const nx=x+dx, ny=y+dy; if (nx>=0&&ny>=0&&nx<W&&ny<W) LAYER[ny*W+nx]=c; }
}
function dimFrame(f){
  for (let i=0;i<W*W;i++){ const c = OUT[i]; OUT[i] = ((255<<24) | (((c>>16&255)*f|0)<<16) | (((c>>8&255)*f|0)<<8) | ((c&255)*f|0)) >>> 0; }
}
const hearingNow = () => Math.floor(now()/7000) % 2 === 0;        // 7 s oye todo, 7 s ve todo: nunca las dos a la vez
function kushPose(fr,t){
  const a = curAnim(), m = mood(), g = (game && game.kind === 'kush') ? game : null;
  const hearing = g ? g.mode === 'hear' : hearingNow();
  const p = { sleep:kushAsleep(), eyes:'open', tail:[0,1,2,1][(fr>>1)%4], earTw:(fr%37===0), ears:'norm', bob:(fr%8<4)?0:1, peek:false, mouth:'w', dx:0, dy:0, shake:0 };
  if (!p.sleep) {
    if (hearing) { p.eyes = 'closed'; p.ears = 'up'; p.earTw = fr%3 === 0; }        // oye todo: ojos cerrados, orejas paradas y moviéndose
    else { p.eyes = 'open'; p.ears = 'flat'; if (fr%30 === 0) p.eyes = 'closed'; }    // ve todo: ojos de par en par, orejas atrás
    switch (m) {
      case 'sick':   p.eyes = 'closed'; p.ears = 'flat'; p.shake = (fr%2) ? 1 : 0; break;
      case 'hungry': case 'sad': if (!g) p.ears = 'flat'; break;
      case 'sleepy': if (!g) p.eyes = (fr%8<6) ? 'half' : 'closed'; break;
    }
  }
  if (g && g.pounce) {                               // zarpazo hacia la columna elegida
    const jt = now() - g.pounce.t0;
    if (jt >= 0 && jt < 420) { const s = Math.sin(Math.PI * jt / 420); p.dx = (g.pounce.zone - 1) * 10 * s; p.dy = -6 * s; p.eyes = 'open'; p.ears = 'flat'; p.mouth = 'open'; }
  }
  if (a) {
    const e = now() - a.t0;
    if (a.type === 'kushpeek') p.peek = true;
    if (a.type === 'kushblink') p.eyes = 'closed';
    if (a.type === 'kushpet' || a.type === 'kushwin') { p.eyes = 'happy'; p.tail = [0,2,0,2][fr%4]; p.ears = 'norm'; }
    if (a.type === 'clean') { p.eyes = 'happy'; p.tail = [0,2,0,2][fr%4]; }
    if (a.type === 'med') p.eyes = 'closed';
    if (a.type === 'no') p.shake = (Math.floor(e/90)%2) ? 1 : -1;
    if (a.type === 'eat') {
      const q = eatPose(a, e, fr);
      p.eyes = q.eyes === 'xd' ? 'happy' : q.eyes; p.mouth = q.mouth === 'smile' ? 'w' : q.mouth; p.ears = 'norm';
      p.tail = [0,2,0,2][fr%4]; p.shake = q.shake; p.dy = -q.jump; p.dx = q.dx || 0;
    }
  }
  return p;
}
function drawKush(p,night,t){
  T = LAYER; LAYER.fill(0);
  const out = night ? K.outNight : K.outDay;
  if (p.sleep) {
    const br = Math.round(Math.sin(t*1.8)*.8);                       // respira
    thickLine(47,51,42,54,K.body,3); thickLine(42,54,30,55,K.body,3); thickLine(30,55,22,53,K.body,3);   // cola alrededor
    ell(34,48,14,7,K.body); ell(35,43-br,10,5.5,K.body);

    ell(21,46,8.5,6.8,K.body);
    poly([[14,43],[13,34],[21,40]],K.body); poly([[25,40],[28,33],[31,42]],K.body);
    outline(out);
    ONLY = K.body; ell(36,41-br,5,2,K.hi); ell(21,42,4,1.5,K.hi); ONLY = null;

    rect(21,48,2,1,K.nose);
    rect(9,47,5,1,K.whisk); rect(28,47,5,1,K.whisk);

  }
  const hy = p.bob|0, tw = p.tail|0, et = p.earTw ? 1 : 0;
  thickLine(41,51,47,50,K.body,3); thickLine(47,50,51,45,K.body,3); thickLine(51,45,52+tw,38,K.body,3);   // cola
  ell(32,48,10.5,6.5,K.body); ell(32,41,7.5,8.5,K.body);
  ell(27.5,50.5,2.8,4.5,K.body); ell(36.5,50.5,2.8,4.5,K.body);
  ell(27,53,3.8,1.8,K.body); ell(37,53,3.8,1.8,K.body);
  ell(32,28+hy,12.5,9.5,K.body); ell(20.5,31+hy,3,3,K.body); ell(43.5,31+hy,3,3,K.body);
  // orejas: paradas (oyendo), hacia atrás (viendo) o normales
  const E = p.ears === 'up' ? { l:[[21,25],[20+et*1.5,6],[30,19]], r:[[43,25],[44-et*1.5,6],[34,19]] }
          : p.ears === 'flat' ? { l:[[21,25],[13,14],[29,20]], r:[[43,25],[51,14],[35,20]] }
          : { l:[[21,25],[19+et,10],[30,19]], r:[[43,25],[45,10+et],[34,19]] };
  const ear = pts => pts.map(([x,y]) => [x, y+hy]);
  poly(ear(E.l),K.body); poly(ear(E.r),K.body);

  ONLY = K.body; ell(32,45,4,5.5,K.hi); ell(32,21+hy,5,2,K.hi); ell(24.5,50,2.2,3,K.hi); ONLY = null;
  const inner = pts => { const cx = (pts[0][0]+pts[1][0]+pts[2][0])/3, cy = (pts[0][1]+pts[1][1]+pts[2][1])/3; return pts.map(([x,y]) => [cx+(x-cx)*.55, cy+(y-cy)*.55+hy]); };
  poly(inner(E.l),K.earIn); poly(inner(E.r),K.earIn);
  const ey = 29 + hy;
  const eye = (cx,k) => {
    if (k === 'open') { ell(cx,ey,3.3,3.9,K.eye); rect(cx,ey-3,1,6,K.eyeDk); put(cx-2,ey-2,C.white); }
    else if (k === 'half') { ell(cx,ey+1,3.2,1.8,K.eye); rect(cx,ey,1,3,K.eyeDk); rect(cx-3,ey-1,7,1,K.soft); }
    else if (k === 'closed') { rect(cx-3,ey+1,7,1,K.soft); put(cx-3,ey,K.soft); put(cx+3,ey,K.soft); }
    else if (k === 'happy') { rect(cx-2,ey-1,5,1,K.soft); put(cx-3,ey,K.soft); put(cx+3,ey,K.soft); }

  };
  eye(25,p.eyes); eye(39,p.eyes);

  if (p.mouth === 'open') { ell(32,38+hy,2.8,2.2,K.mouthIn); ell(32,39.3+hy,1.6,.9,C.tongue); }

  rect(10,32+hy,8,1,K.whisk); rect(11,35+hy,7,1,K.whisk); rect(47,32+hy,8,1,K.whisk); rect(47,35+hy,7,1,K.whisk);
}

/* ondas de sonido del ratón: solo se OYEN en modo 👂 (se dibujan sobre la pantalla oscurecida) */

  }
}

/* pantalla de la intro: silueta con rayo / oscuridad con ojos / disolución hacia la escena real */
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const TARGET = new Uint32Array(W*W), DARKB = new Uint32Array(W*W), EYEB = new Uint32Array(W*W);
const BOLT_A = [[46,0],[41,8],[46,13],[38,23],[43,27],[35,40]];
const BOLT_B = [[30,0],[35,7],[28,14],[34,21],[27,29],[32,37],[30,46]];
function composeKushIntro(e,fr){
  const k = kushIntro;
  // 1) lo que veremos al final (escena real con Kush) ya está en LAYER/SCENE
  for (let i=0;i<W*W;i++) TARGET[i] = LAYER[i] || SCENE[i];
  // 2) ojos de Kush en la oscuridad (aparecen con trama, parpadean una vez)
  EYEB.fill(0); T = EYEB;
  if (kushAsleep()) [18,25].forEach(cx => { ell(cx,46,2.6,2.2,K.eye); rect(cx,44,1,5,K.eyeDk); put(cx-1,45,C.white); });   // dormida: ahí estará su cabeza
  else [25,39].forEach(cx => { ell(cx,29,3.2,3.7,K.eye); rect(cx,26,1,6,K.eyeDk); put(cx-2,27,C.white); });                 // sentada
  const fade = Math.min(1, Math.max(0, (e-600)/700)), blink = e >= 1500 && e < 1620;
  const BLACK = col('#04050c'), WHITE = col('#eef0ff');
  DARKB.fill(BLACK);
  for (let i=0;i<W*W;i++) if (EYEB[i] && !blink && BAYER[((i/W|0)&3)*4+((i%W)&3)] < fade*16) DARKB[i] = EYEB[i];
  // 3) destellos (trueno + rayo): fondo claro, Kush en silueta negra
  const flash1 = e >= 2200 && e < 2330, flash2 = (e >= 2600 && e < 2650) || (e >= 2700 && e < 2800);
  if (e >= 2200 && !k.s1) { k.s1 = true; sfx('thunder'); }
  if (e >= 2600 && !k.s2) { k.s2 = true; sfx('thunder'); }
  if (e >= 2800 && !k.s3) { k.s3 = true; sfx('mew'); }
  if (flash1 || flash2) {
    for (let i=0;i<W*W;i++) { const c = LAYER[i]; OUT[i] = c ? (c === K.eye || c === K.eyeDk ? c : col('#0b0a14')) : WHITE; }
    T = OUT;
    const bolt = flash1 ? BOLT_A : BOLT_B;
    for (let i=0;i<bolt.length-1;i++) thickLine(bolt[i][0],bolt[i][1],bolt[i+1][0],bolt[i+1][1],col('#3b3560'),5);
    for (let i=0;i<bolt.length-1;i++) thickLine(bolt[i][0],bolt[i][1],bolt[i+1][0],bolt[i+1][1],col('#ffe97a'),3);
    for (let i=0;i<bolt.length-1;i++) thickLine(bolt[i][0],bolt[i][1],bolt[i+1][0],bolt[i+1][1],C.white,1);
    return;
  }
  // 4) la noche se despeja: de la oscuridad a la escena real (disolución tramada)
  const p = Math.min(1, Math.max(0, (e-2800)/1500));
  for (let i=0;i<W*W;i++) OUT[i] = BAYER[((i/W|0)&3)*4+((i%W)&3)] < p*16 ? TARGET[i] : DARKB[i];
}
let lastSqueak = -1;
function renderKush(t,fr){
  const g = (game && game.kind === 'kush') ? game : null;
  const night = isNight() || !!g, pal = night ? PAL.night : PAL.day;      // en el minijuego siempre es de noche
  if (kushIntro && now() - kushIntro.t0 >= INTRO_MS) kushIntro = null;
  drawScene(pal,t,fr,night,S.k.poops);
  const p = kushPose(fr,t);
  drawKush(p,night,t);
  shiftLayer(p.dx + p.shake, p.dy);
  T = LAYER;
  const a = curAnim();
  if (!kushIntro) drawMoodBubble(mood(), a);
  if (p.sleep) { const o = Math.floor(t*2)%3, Z = ['xxxxx','...x.','..x..','.x...','xxxxx']; bmp(Z,10+o,28-o*2,{x:K.z}); if (o>0) bmp(Z,6,20-o,{x:K.z}); }
  if (a) {
    const e = now() - a.t0;
    if (a.type === 'eat') drawFood(a,e,fr,32,36);
    if (a.type === 'clean') fxClean(e);
    if (a.type === 'med') fxMed(e);
  }
  if (g && g.prey) {                                     // el ratón: visible solo si Kush está en modo "ver"
    const pr = g.prey, x = HS_X[pr.zone];
    if (!pr.done && pr.type === 'see' && g.mode === 'see') drawMouse(x + Math.round(Math.sin((now()-pr.t0)/110)), 50, fr);
    if (pr.done && pr.caught && now() - pr.endAt < 700) { sparkle(x-3, 46, true); sparkle(x+4, 44, false); }
  }
  drawHearts();
  if (kushIntro) composeKushIntro(now() - kushIntro.t0, fr);
  else for (let i=0;i<W*W;i++) OUT[i] = LAYER[i] || SCENE[i];
  if (g && g.mode === 'hear') {                          // oyendo: el mundo se oscurece y solo se perciben las ondas
    dimFrame(.42); T = OUT;
    if (g.prey && !g.prey.done && g.prey.type === 'hear') {
      drawRings(HS_X[g.prey.zone], 50, g.prey.t0);
      if (fr !== lastSqueak && fr%3 === 0) { lastSqueak = fr; sfx('squeak'); }
    }
  }
  ctx.putImageData(img,0,0);
  updateHud();
}

function render(){
  const t = performance.now()/1000, fr = Math.floor(t*4);
  if (S.char === 'kush') return renderKush(t,fr);
  const st = stageOf(), pal = S.sleeping ? PAL.night : PAL.day;
  drawScene(pal,t,fr,S.sleeping,S.poops);
  const p = pose(fr,t);
  if (st==='egg') { drawEgg(p,pal); }
  else { drawDog(p,pal,st,fr,t); }
  drawEffects(pal,p,fr,t,st);
  for (let i=0;i<W*W;i++) OUT[i] = LAYER[i] || SCENE[i];
  ctx.putImageData(img,0,0);
  updateHud();
}

/* ---------- HUD ---------- */
let hudAt = 0;
function updateHud(){
  const t = now(); if (t - hudAt < 250) return; hudAt = t;
  const m = mood(), kush = isKush(), p = pet(), sl = asleepNow(), ready = kush || S.hatched, L = I18N[LANG];
  let line;
  if (game) line = game.say;
  else if (kush) {
    if (kushIntro) line = '…';
    else if (m === 'ok' || m === 'happy') line = p.poops ? L['kush.say.poop'][0] : L[hearingNow() ? 'kush.say.hear' : 'kush.say.see'][0];
    else line = (L['kush.say.'+m] || L['kush.say.hear'])[0];
  } else {
    if (m==='ok' || m==='happy') line = p.poops ? tr('say.poop')[0] : null;
    if (!line) { const arr = L['say.'+m] || L['say.ok']; line = arr[Math.floor(t/7000) % arr.length]; }
  }
  const sayEl = $('#say'); if (sayEl.textContent !== line) sayEl.textContent = line;
  for (const k of ['hunger','happy','energy']) {
    const el = document.querySelector(`.bar[data-k=${k}]`);
    el.querySelector('i').style.width = clamp(p[k]) + '%';
    el.classList.toggle('low', ready && p[k] < 25);
  }
  document.querySelector('.bar[data-k=energy]').classList.toggle('charging', ready && sl && p.energy < 99);
  $('#bars').style.visibility = ready ? 'visible' : 'hidden';
  $('#bFeed').classList.toggle('alert', ready && !sl && p.hunger < 25);
  $('#bClean').classList.toggle('alert', ready && p.poops > 0 && !sl);
  $('#bMed').classList.toggle('alert', ready && p.sick);
  $('#bPlay').classList.toggle('alert', ready && !sl && !p.sick && p.happy < 25 && p.energy >= 20);
  $('#bLight').classList.toggle('alert', ready && !kush && !sl && p.energy < 20);
}

/* ---------- arranque ---------- */
applyLang();
if (S.char === 'kush') startKushIntro();     // si te quedaste con Kush, su intro corre cada vez que abres el juego
syncChars();
tick(); lastMood = mood();
setInterval(() => { tick(); }, 1000);
setInterval(save, 5000);
setInterval(render, 80);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
window.addEventListener('pagehide', save);
render();

window.__tdg = { get S(){ return S; }, advance, tick, render, save, addDevotion, startAnim, mood, stageOf, setChar, startKushIntro, get kushIntro(){ return kushIntro; }, kushAsleep, isNight,
                 pet, get game(){ return game; }, FOODS, feed, gameTap, pounce, setMode };
})();
</script>
